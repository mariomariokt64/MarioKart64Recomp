name: fork-build

# Builds the game with the patches in fork-patches/ for Windows, Linux (x64 and arm64, AppImage and tar.gz),
# the Flatpak, and macOS (one universal app: Intel and Apple silicon), by calling upstream's validate.yml.
#
# Four ways to start it:
#   * By hand, to check a branch: Actions -> fork-build -> Run workflow (tick "Also build Debug" for Debug builds too).
#   * By hand, to make a release: the same, with "release_tag" filled in. The tag is created on the commit that is built,
#     and the release gets the builds. "draft" keeps it unpublished until you publish it.
#   * By pushing a tag named mk64coop-game-<N>: builds it and creates the release.
#   * By publishing a GitHub release (the Releases page, any tag): builds the tagged commit and UPLOADS the builds to that
#     release. A release that already has files is left alone, so publishing a draft this workflow made does not build again.
#
# The ROM comes from the private repository named by the secrets MK64_REPO_WITH_PAT (its name) and MK64_TOKEN
# (a read-only token for it), exactly as upstream's builds get it. It is never part of an artifact or a release:
# the release job stops if any file looks like a ROM.
on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Also build Debug (Release only when unticked)'
        type: boolean
        default: false
      release_tag:
        description: 'Make a release with this tag from the built commit (leave empty for a check build)'
        type: string
        default: ''
      draft:
        description: 'Keep the release a draft until you publish it'
        type: boolean
        default: false
  push:
    tags:
      - 'mk64coop-game-*'
  release:
    types: [published]

jobs:
  # Decides the release tag and whether anything needs building. The tag is checked here, once, and handed on as an
  # output: no later step puts the text of an input into a shell command.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.p.outputs.tag }}
      build: ${{ steps.p.outputs.build }}
    steps:
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          tag=""
          case "$EVENT" in
            release) tag="$RELEASE_TAG" ;;
            push) tag="$REF_NAME" ;;
            workflow_dispatch) tag="$INPUT_TAG" ;;
          esac
          if [ -n "$tag" ] && ! printf '%s' "$tag" | grep -Eq '^[A-Za-z0-9._-]{1,100}$'; then
            echo "the release tag may only have letters, digits, dots, dashes and underscores" >&2
            exit 1
          fi
          build=true
          if [ "$EVENT" = release ]; then
            files=$(gh release view "$tag" --repo "$REPO" --json assets --jq '.assets | length')
            if [ "$files" -gt 0 ]; then build=false; echo "release $tag already has $files files; not building"; fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag='$tag' build=$build"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/validate.yml
    with:
      BUILD_TYPES: ${{ (github.event_name == 'workflow_dispatch' && inputs.debug) && '["Debug","Release"]' || '["Release"]' }}
      WINDOWS_BUILD_TYPES: ${{ (github.event_name == 'workflow_dispatch' && inputs.debug) && '["Debug","RelWithDebInfo"]' || '["RelWithDebInfo"]' }}
    secrets: inherit

  release:
    needs: [plan, build]
    if: needs.plan.outputs.tag != '' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (for the release notes)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download the builds
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: MarioKart64Recompiled-*
          merge-multiple: false

      - name: Leave out Debug, PDB and anything that is not a release build
        run: |
          set -eu
          find artifacts -mindepth 1 -maxdepth 1 -type d \( -name '*-Debug' -o -name '*PDB*' \) -exec rm -rf {} +
          ls -R artifacts | head -50

      - name: Refuse anything that looks like a ROM
        run: |
          set -eu
          # A ROM has a ROM extension, or the SHA-1 of the one the build uses. Either stops the release: nothing of
          # the game's assets is ever published.
          bad=0
          while IFS= read -r f; do
            case "$f" in
              *.z64|*.n64|*.v64) echo "ROM extension: $f"; bad=1 ;;
            esac
            sum=$(sha1sum "$f" | cut -d' ' -f1)
            if [ "$sum" = "579c48e211ae952530ffc8738709f078d5dd215e" ]; then echo "ROM hash: $f"; bad=1; fi
          done < <(find artifacts -type f)
          # The archives pack the ROM-free files only, but look inside them as well.
          for a in $(find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \)); do
            case "$a" in
              *.zip) listing=$(unzip -Z1 "$a") ;;
              *) listing=$(tar -tzf "$a") ;;
            esac
            if printf '%s\n' "$listing" | grep -i -E '\.(z64|n64|v64)$'; then echo "ROM inside: $a"; bad=1; fi
          done
          [ "$bad" = 0 ] || { echo "refusing to publish"; exit 1; }
          echo "no ROM found"

      - name: Name the files by platform
        run: |
          set -eu
          mkdir -p release
          for d in artifacts/*/; do
            n=$(basename "$d")
            if [ -n "$(find "$d" -mindepth 1 -type d -print -quit)" ]; then
              # An artifact with a folder in it (Windows: the exe, its DLLs and assets/) goes out as ONE zip, so the
              # folder is not lost. Files that are already archives (tar.gz, AppImage, zip, flatpak) go out as they are.
              (cd "$d" && zip -qr "$GITHUB_WORKSPACE/release/${n}.zip" .)
            else
              for f in "$d"*; do
                [ -f "$f" ] || continue
                cp "$f" "release/${n}__$(basename "$f")"
              done
            fi
          done
          ls -la release

      - name: Release notes
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -eu
          {
            echo "Game builds of MarioKart64Recomp (the NewFrontend branch of sonicdcer/MarioKart64Recomp) with a few fixes."
            echo
            echo "Built from commit ${GITHUB_SHA} of ${GITHUB_REPOSITORY}, tag ${TAG}."
            echo
            echo "- Windows (x64), Linux (x64 and arm64, AppImage and tar.gz), macOS (one app for Intel and Apple silicon)."
            echo "- The game needs your own copy of Mario Kart 64 (US): no ROM and no game assets are in these files."
            echo "- What differs from upstream: the Keyboard Players option, per-player keyboard keys, and mixed gamepad and keyboard"
            echo "  assignment. Every change to the game and to the projects it is built from is in this repository (fork-patches/ and the commits)."
            echo
            echo "MarioKart64Recomp, RecompFrontend and RT64 are GPL-3.0 projects by their authors; this is a fork of their work, with credit"
            echo "to sonicdcer, Mr-Wiseguy and the N64Recomp, RT64 and Plume teams. The source is this repository and its submodules."
          } > notes.md
          cat notes.md

      # An existing release (one just published, or made by hand) gets the files; otherwise the release is created at the
      # built commit. --clobber replaces a file of the same name from an earlier run.
      - name: Upload to the release, or create it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
        run: |
          set -eu
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            flags=""
            [ "$DRAFT" = "true" ] && flags="--draft"
            # shellcheck disable=SC2086
            gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md $flags --repo "$GITHUB_REPOSITORY"
          fi
